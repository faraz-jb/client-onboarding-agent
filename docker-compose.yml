services:
  web:
    build: .
    container_name: client-onboarding-agent
    # Real secrets live here on the VPS only — gitignored, never committed.
    # Copy .env.production.example to .env.production and fill it in.
    env_file: .env.production
    # Bound to loopback: Traefik terminates TLS and proxies in front of it, so
    # the port is never exposed on a public interface.
    ports:
      - "127.0.0.1:3018:3000"
    volumes:
      # Persistent SQLite. Must stay mounted at /app/data — both runtimes
      # resolve the database there (see DB_PATH in .env.production.example).
      - ./data:/app/data
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.onboarding.rule=Host(`onboarding.aiinvention.tech`)"
      - "traefik.http.routers.onboarding.entrypoints=websecure"
      - "traefik.http.routers.onboarding.tls.certresolver=letsencrypt"
      - "traefik.http.services.onboarding.loadbalancer.server.port=3000"
      - "traefik.http.routers.onboarding_http.rule=Host(`onboarding.aiinvention.tech`)"
      - "traefik.http.routers.onboarding_http.entrypoints=web"
      - "traefik.http.routers.onboarding_http.middlewares=redirect-to-https"
    healthcheck:
      # `/` is the public landing page — reachable without a session.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
